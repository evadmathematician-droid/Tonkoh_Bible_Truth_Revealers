name: tbtrapp
description: TBTR App - Gospel audio, chat, and calling
publish_to: 'none'
version: 3.2.3+30

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2

  firebase_core: ^4.5.0
  firebase_database: ^12.1.4
  firebase_auth: ^6.2.0

  go_router: ^16.2.1

  flutter_webrtc: ^1.6.0
  flutter_local_notifications: ^18.0.0
  flutter_foreground_task: ^11.0.3

  just_audio: ^0.9.42
  audio_service: ^0.18.15
  video_player: ^2.9.5
  cached_network_image: ^3.4.1
  # putFile: a photo I send shows from the copy on this phone, not a re-download.
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  record: ^7.1.2

  dio: ^5.7.0
  http: ^1.6.0
  path: ^1.9.1
  sqflite: ^2.4.3
  crypto: ^3.0.7
  # Re-encodes profile photos as small JPEGs (pure Dart).
  image: ^4.5.0

  gal: ^2.3.0

  file_picker: ^9.0.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

  onesignal_flutter: ^5.2.9

  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  flutter_contacts: ^2.6.0
  phone_numbers_parser: ^9.0.0
  intl_phone_field: ^3.2.0
  url_launcher: ^6.3.1

  intl: ^0.19.0
  share_plus: ^11.0.0
  permission_handler: ^11.3.1
  pasteboard: ^0.4.0

  cupertino_icons: ^1.0.8
  vibration: ^3.2.0
  device_info_plus: ^12.0.0
  firebase_remote_config: ^6.7.0
  package_info_plus: ^9.0.1
  in_app_update: ^5.0.0
  scrollable_positioned_list: 0.3.8
  youtube_player_iframe: 6.0.2
  flutter_image_compress: ^2.5.1
  image_cropper: ^12.2.1
  photo_view: ^0.15.0

  # web: removed — pulled in transitively; pinning it caused the SDK/js_interop
  # mismatch errors. Add back only if you call dart:js_interop directly.

# Local copies of plugins migrated to Built-in Kotlin (no Kotlin Gradle
# Plugin warning). See third_party/README.md — remove each override once the
# official package ships the same migration.
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc
  pasteboard:
    path: third_party/pasteboard
  device_info_plus:
    path: third_party/device_info_plus
  package_info_plus:
    path: third_party/package_info_plus
  share_plus:
    path: third_party/share_plus
  firebase_core:
    path: third_party/firebase_core
  firebase_auth:
    path: third_party/firebase_auth
  firebase_database:
    path: third_party/firebase_database
  firebase_remote_config:
    path: third_party/firebase_remote_config

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/sounds/ringback.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256