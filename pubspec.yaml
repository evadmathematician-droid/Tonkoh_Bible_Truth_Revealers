name: tbtrapp
description: TBTR App - Gospel audio, chat, and calling
publish_to: 'none'
version: 3.1.1+22

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2

  firebase_core: ^4.5.0
  firebase_database: ^12.1.4
  firebase_auth: ^6.2.0
  crypto: ^3.0.6

  go_router: ^16.2.1

  flutter_webrtc: ^1.6.0
  flutter_local_notifications: ^18.0.0
  flutter_foreground_task: ^8.0.0

  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.17
  audioplayers: ^6.1.0
  video_player: ^2.9.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  record: ^6.0.0

  dio: ^5.7.0
  http: ^1.2.0

  gal: ^2.3.0

  file_picker: ^12.0.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

  onesignal_flutter: ^5.2.9


  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  sqflite: ^2.4.3
  path: ^1.9.1

  flutter_contacts: ^1.1.9+2
  phone_numbers_parser: ^9.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1

  intl: ^0.19.0
  share_plus: ^13.3.0
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8
  in_app_update: ^5.0.0

  # web: removed — pulled in transitively; pinning it caused the SDK/js_interop
  # mismatch errors. Add back only if you call dart:js_interop directly.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpeg"
  min_sdk_android: 21
