<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <base href="/Tonkoh_Bible_Truth_Revealers/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tonkoh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tonkoh</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<!--
  You can customize the "flutter_bootstrap.js" script.
  This is useful to provide a custom configuration to the Flutter loader
  or to give the user feedback during the initialization process.

  For more details:
  * https://docs.flutter.dev/platform-integration/web/initialization
-->
<script src="flutter_bootstrap.js" async></script>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({ appId: "371c8ad4-ea1c-4308-bc45-cfab712b9670" });
  });

  window.tonkohRequestPushPermission = function () {
    return new Promise((resolve) => {
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.Notifications.requestPermission();
        resolve();
      });
    });
  };

  window.tonkohGetSubscriptionId = function () {
    return new Promise((resolve) => {
      OneSignalDeferred.push(async function (OneSignal) {
        resolve(OneSignal.User.PushSubscription.id || null);
      });
    });
  };

  window.tonkohOnSubscriptionChange = function (dartCallback) {
    OneSignalDeferred.push(async function (OneSignal) {
      OneSignal.User.PushSubscription.addEventListener("change", (event) => {
        const id = event.current.id;
        if (id) dartCallback(id);
      });
    });
  };
</script>
</body>
</html>
