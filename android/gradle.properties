org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Daemon disabled: this machine has 8GB RAM total and repeatedly hits
# native-memory OOM crashes (hs_err_pid*.log) when a lingering Gradle
# daemon from an earlier session sits alongside Android Studio's own
# daemon and a new build. A non-daemon build starts a fresh JVM that
# fully exits and frees its memory when the build finishes, instead of
# staying resident and accumulating across sessions. Trade-off: each
# build pays JVM startup cost again (no warm daemon reuse) — turn this
# back on (org.gradle.daemon=true) if this machine gets more RAM.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
