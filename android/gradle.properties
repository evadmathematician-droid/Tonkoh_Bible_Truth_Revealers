org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep builds inside one JVM and limit parallel work: on a machine with
# ~8 GB of RAM a separate Kotlin daemon plus parallel R8/dex workers ran the
# system out of memory.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
# Idle Gradle daemons hold ~2 GB each for 3 hours by default; on an 8 GB
# machine two leftovers starved the next build (Dart "Could not start thread
# DartWorker: 22"). Let them exit after 10 idle minutes instead.
org.gradle.daemon.idletimeout=600000
